<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadanie 5 - Formularz Kontaktowy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <header>
            <h1>Skontaktuj się z nami</h1>
            <p>Wypełnij formularz, aby wysłać wiadomość.</p>
        </header>

        <div id="successMessage" class="alert success hidden">
            Formularz został wysłany pomyślnie!
        </div>

        <form id="contactForm" novalidate>
            <!-- Imię -->
            <div class="form-control">
                <label for="firstName">Imię</label>
                <input type="text" id="firstName" placeholder="np. Jan">
                <small class="error-text">Imię nie może być puste i nie może zawierać cyfr.</small>
            </div>

            <!-- Nazwisko -->
            <div class="form-control">
                <label for="lastName">Nazwisko</label>
                <input type="text" id="lastName" placeholder="np. Kowalski">
                <small class="error-text">Nazwisko nie może być puste i nie może zawierać cyfr.</small>
            </div>

            <!-- E-mail -->
            <div class="form-control">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="jan@przyklad.pl">
                <small class="error-text">Wprowadź poprawny adres e-mail.</small>
            </div>

            <!-- Wiadomość -->
            <div class="form-control">
                <label for="message">Wiadomość</label>
                <textarea id="message" rows="4" placeholder="Twoja wiadomość..."></textarea>
                <small class="error-text">Pole wiadomość jest wymagane.</small>
            </div>

            <button type="submit" id="submitBtn">Wyślij wiadomość</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
